<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Yellow Duck: Trust Nothing — A 2D troll platformer where nothing is what it seems. Play as Yellow Duck and survive traps, fake floors, and deception.">
  <title>Yellow Duck: Trust Nothing</title>
  <style>
    /* Section 25/26 — Dark theme, no rounded corners */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0D0D0D;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Section 38 — Orientation: Landscape preferred */
    #rotate-message {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0D0D0D;
      color: #FFFFFF;
      font-family: monospace;
      font-size: 18px;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 9999;
      flex-direction: column;
      gap: 16px;
    }
    #rotate-message span {
      font-size: 48px;
    }
    @media (orientation: portrait) {
      #rotate-message {
        display: flex;
      }
      #game-container {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- Section 38 — Rotate Device Message -->
  <div id="rotate-message">
    <span>🔄</span>
    <p>Please rotate your device to landscape mode.</p>
  </div>

  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>

  <!-- Game Entry Point -->
  <script type="module" src="./src/core/game.js"></script>
</body>
</html>
